name: CI

# This SDK is consumed straight from GitHub, not from PyPI -- there is
# deliberately no publish step. Without a registry release to act as a gate,
# main is what people install, so it has to be verified on every push.
#
# Consumers install it from git:
#   pip install git+https://github.com/Pixault/pixault-python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject requires >=3.10; check the floor and a current release.
        python: ['3.10', '3.13']

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Install and import
        run: |
          set -euo pipefail
          python -m pip install .
          python -c "import pixault; print('imported pixault OK')"

      - name: Build
        run: python -m build

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          ls -l dist/
          test -n "$(find dist -name '*.whl'    -size +1k -print -quit)" || { echo "::error::no wheel built"; exit 1; }
          test -n "$(find dist -name '*.tar.gz' -size +1k -print -quit)" || { echo "::error::no sdist built"; exit 1; }
